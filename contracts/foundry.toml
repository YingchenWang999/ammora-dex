[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
via_ir = true
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 32, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
